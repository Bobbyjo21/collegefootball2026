name: Check frozen 2026 model on 2025
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/frozen-2025.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backtest 2025
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node backtest-2025-frozen.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-2025-results
          path: backtests/2025-*.json
