name: Update CFB data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'update-stats.mjs'
      - 'normalize.mjs'
      - 'package.json'
      - 'test-normalize.mjs'
      - 'test-browser.mjs'
  workflow_dispatch:
  schedule:
    - cron: "15 10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: cfb-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and normalize current statistics
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_SEASON: ${{ vars.CFB_SEASON }}
        run: node update-stats.mjs
      - name: Test normalized data
        run: npm test
      - name: Commit changed data
        run: |
          git config user.name "CFB Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-data.json
          git diff --cached --quiet || git commit -m "Update CFB data"
          git push
