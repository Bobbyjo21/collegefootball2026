name: Backtest CFB 2026 spreads
on:
  push:
    branches: [main]
    paths:
      - 'backtest-2026.mjs'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild point-in-time weeks and grade historical spreads
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_SEASON: '2026'
        run: node backtest-2026.mjs
      - name: Commit audited results
        run: |
          git config user.name "CFB Backtest Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/2026-cfb.csv backtests/2026-summary.json
          git diff --cached --quiet || git commit -m "Refresh 2026 historical CFB spread backtest"
          git push
