name: Cross-season CFB research
on:
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * *'
  push:
    branches: [main]
    paths:
      - 'cross-season-research.mjs'
      - '.github/workflows/cross-season.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Train on older years and test 2026 unseen season
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: node cross-season-research.mjs
      - name: Commit report
        run: |
          git config user.name "CFB Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtests/2022-2026-cross-season.json
          git diff --cached --quiet || git commit -m "Update cross-season CFB feature research"
          git push
